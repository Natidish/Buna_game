<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☕ Buna Game</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0e68c;
      padding: 20px;
    }
    button {
      background: #228B22;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 10px;
      margin: 10px;
    }
    .counter {
      font-size: 22px;
      margin: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>☕ Buna Game</h1>
  <p>Tap and collect Buna points</p>

  <button onclick="tap()">☕ Buna +1</button>

  <div class="counter">Buna: <span id="buna">0</span></div>
  <div class="counter">Points: <span id="points">0</span></div>

  <button onclick="dailyBonus()">⭐ Daily Bonus</button>
  <button onclick="shareGame()">👥 Share Game</button>

  <script>
    /* ---------------- Telegram Setup ---------------- */
    const tg = Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;
    if (user) {
      console.log("User ID:", user.id);
    }

    /* ---------------- Game State ---------------- */
    let buna = parseInt(localStorage.getItem("buna")) || 0;
    let points = parseInt(localStorage.getItem("points")) || 0;

    updateUI();

    /* ---------------- Functions ---------------- */

    function tap() {
      buna++;
      points++;

      save();
      updateUI();

      if (navigator.vibrate) navigator.vibrate(40);
    }

    function dailyBonus() {
      const today = new Date().toDateString();
      const last = localStorage.getItem("lastBonus");

      if (last !== today) {
        buna += 200;
        points += 200;
        localStorage.setItem("lastBonus", today);

        save();
        updateUI();
        alert("⭐ Daily Bonus: +200 Buna");
      } else {
        alert("✅ You already claimed today’s bonus");
      }
    }

    function shareGame() {
      Telegram.WebApp.openTelegramLink(
        "https://t.me/share/url?url=https://t.me/BunaGameBot&text=☕%20Play%20Buna%20Game!"
      );
    }

    /* ---------------- Helpers ---------------- */

    function save() {
      localStorage.setItem("buna", buna);
      localStorage.setItem("points", points);
    }

    function updateUI() {
      document.getElementById("buna").innerText = buna;
      document.getElementById("points").innerText = points;
    }
  </script>

</body>
</html>
